<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payout Portal · Bird’s Nest Auctions</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
:root{
  --teal:#2D6B5E; --teal-ink:#1f4c43; --coral:#E8806B; --button:#567a7b;
  --bg:#eef2f0; --panel:#fff; --ink:#1d2624; --muted:#5d6b67; --rule:#dbe3e0; --tint:#f4f8f6; --sel:#e3efeb;
  --bad-bg:#fbe9e5; --bad:#9a3a26; --warn-bg:#fdf1e6; --warn:#8a4b12; --ok-bg:#e6f2ec; --ok:#2f6b3f;
  --ours:#c0634d; --client:#8a6aa8; --item:#4f7fa8; --other:#8b8f6a; --unpaid:#8a8f92;
  --display:"Cormorant Garamond", Georgia, serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --teal:#5fae9b; --teal-ink:#9fd3c4; --button:#5f8a8b;
  --bg:#141a19; --panel:#1c2422; --ink:#e4ebe8; --muted:#9aaba6; --rule:#2e3a37; --tint:#212b29; --sel:#24332f;
  --bad-bg:#3a201b; --bad:#f3a592; --warn-bg:#2e2418; --warn:#f2c48f; --ok-bg:#1d2e24; --ok:#8fd19f;
  --ours:#e0826c; --client:#b597d1; --item:#7fa9cf; --other:#b4b88f; --unpaid:#a3a9ac; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}
a{color:var(--teal-ink)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left));display:grid;gap:18px}
nav.top{background:var(--panel);border-bottom:1px solid var(--rule)}
nav.top .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
nav.top img{height:38px;width:auto}
nav.top .links{display:flex;gap:4px;flex-wrap:wrap}
nav.top .links a{text-decoration:none;color:var(--muted);font-weight:500;padding:6px 12px;border-radius:99px}
nav.top .links a.on{background:var(--sel);color:var(--teal-ink)}
nav.top .who{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;margin:0;color:var(--teal-ink);text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:23px;margin:0 0 10px;color:var(--teal-ink)}
h3{margin:0 0 4px;font-size:15px}
.sub,.meta{color:var(--muted);font-size:13px}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.head{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:13px 16px}
.stat.lead{background:var(--teal);border-color:var(--teal);color:#fff}
.stat.lead .label,.stat.lead .n{color:rgba(255,255,255,.85)}
.stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.stat .n{font-size:12.5px;color:var(--muted)}
.stat.bad .v{color:var(--bad)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--teal);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--tint)}
.r{text-align:right}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.plain{background:var(--tint);color:var(--muted);border:1px solid var(--rule)}
.btn{border:1px solid var(--button);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:5px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.primary{background:var(--button);color:#fff}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn.link{border:none;background:none;color:var(--teal-ink);padding:4px 6px;text-decoration:underline}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],select,textarea{border:1px solid var(--rule);border-radius:4px;padding:7px 9px;background:var(--panel);font-size:14px;max-width:100%}
textarea{width:100%;min-height:60px}
.field{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.flags{display:grid;gap:10px}
.flag{border:1px solid var(--rule);border-left:4px solid var(--warn);border-radius:6px;padding:12px 14px;display:grid;gap:8px;background:var(--panel)}
.flag.done{border-left-color:var(--ok)}
.flag .t{font-weight:600}
.note{background:var(--tint);border-radius:4px;padding:8px 10px;font-size:13px;white-space:pre-wrap}
.empty{color:var(--muted);padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:6px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--panel);border-radius:8px;padding:20px 22px;max-width:640px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:14px}
.login{max-width:380px;margin:10vh auto;display:grid;gap:14px;text-align:center}
.login img{width:180px;margin:0 auto}
.login form{display:grid;gap:10px;text-align:left}
.steps{display:flex;gap:3px;margin-top:3px}.steps i{display:block;width:20px;height:5px;border-radius:3px;background:var(--rule)}.steps i.on{background:var(--teal)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,200px) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:11px;border-radius:3px;background:var(--tint);overflow:hidden}.fill{height:100%;border-radius:3px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.closeout{display:grid;gap:12px}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;border-top:1px solid var(--rule);padding-top:12px}
.num{width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.step.done .num{background:var(--teal);border-color:var(--teal);color:#fff}
.mail{border:1px solid var(--rule);border-radius:6px;background:var(--tint);padding:12px 14px;font-size:13.5px;white-space:pre-wrap}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 14px;font-size:13.5px}
.badbox{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:10px 14px;font-size:13.5px}

/* Statement (always light; this is what gets printed) */
.stmt-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sheet{max-width:820px;margin:0 auto;background:#fff;color:#1d2624;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 28px rgba(0,0,0,.07);overflow:hidden;color-scheme:light}
.sheet .band{padding:24px 40px 20px;display:flex;flex-wrap:wrap;gap:14px 30px;justify-content:space-between;align-items:center;border-bottom:4px solid #2D6B5E}
.sheet .band img{width:150px}
.sheet .band h1{color:#1f4c43;font-size:30px}
.sheet .tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8a4b12;background:#fdf1e6;border-radius:99px;padding:2px 9px;margin-top:6px}
.sheet .inner{padding:28px 40px 36px;display:grid;gap:28px}
.sheet .meta4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 24px}
.sheet .label{color:#5d6b67}
.sheet .top{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.sheet .bal{background:#f4f8f6;border:1px solid #dbe3e0;border-radius:4px;padding:20px 22px}
.sheet .big{font-family:var(--display);font-weight:600;font-size:46px;color:#1f4c43;line-height:1.05}
.sheet h2{color:#1f4c43}
.sheet .calc td{padding:6px 0;border-bottom:1px solid #dbe3e0}
.sheet .calc td:last-child{text-align:right;white-space:nowrap;padding-left:14px}
.sheet .calc .less td:first-child{padding-left:14px}.sheet .calc .less td:last-child{color:#a24a37}
.sheet .calc .sub td{font-weight:600}
.sheet .calc .total td{border-bottom:none;border-top:2px solid #2D6B5E;font-weight:600;font-size:16.5px;padding-top:9px}
.sheet .ledger{font-size:13px}
.sheet .ledger th{color:#5d6b67;border-bottom-color:#2D6B5E}
.sheet .ledger td{padding:5px 8px;border-bottom:1px solid #dbe3e0}
.sheet .ledger tbody tr:nth-child(even) td{background:#f4f8f6}
.sheet .ledger tfoot td{font-weight:600;border-top:2px solid #2D6B5E;border-bottom:none}
.sheet .note2{font-size:12px;color:#5d6b67;margin:6px 0 0}
.sheet footer{border-top:1px solid #dbe3e0;padding-top:16px;font-size:12px;color:#5d6b67;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.sheet .int{background:#fdf1e6;border:1px dashed #f0c99d;border-radius:4px;padding:12px 16px;font-size:13px;color:#5b3a12}
@media (max-width:640px){.sheet .top{grid-template-columns:1fr}.sheet .band,.sheet .inner{padding-left:18px;padding-right:18px}}
@media print{
  @page{margin:12mm}
  body{background:#fff}
  nav.top,.stmt-bar,.toast,.noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .sheet{box-shadow:none;border-radius:0;max-width:none}
  .sheet .ledger tr{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="payout-math.js"></script>
<script src="app.js"></script>
</body>
</html>
